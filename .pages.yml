# Pages CMS — edición visual del catálogo
# Pages CMS lee este archivo automáticamente al conectar el repositorio.
media:
  input: assets/catalogo_dta
  output: /proyecto-dta/assets/catalogo_dta

content:
  - name: catalogo
    label: Catálogo
    type: file
    path: content/catalogo.json
    fields:
      - name: categorias
        label: Categorías
        type: object
        list: true
        fields:
          - { name: id, label: ID, type: select, options: { values: [dama-planas, dama-altas, altas-cruzadas, caballero] } }
          - { name: nombre, label: Nombre, type: string, required: true }
          - { name: tallas, label: Tallas, type: string }
          - { name: precioDetal, label: Precio Detal, type: number }
          - { name: precioMayor, label: Precio Mayor, type: number }
          - { name: descripcion, label: Descripción, type: text }
          - name: fotos
            label: Fotos
            type: string
            list: true
